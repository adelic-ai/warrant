[project]
name = "sage"
version = "0.1.0"
description = "Delegated authorization for AI agents acting on behalf of human principals — identity, delegation, policy decision, and audit for agentic IAM."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "cedarpy>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
demo = [
    "strands-agents[anthropic]>=1.53",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sage*"]
